services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: e2euser
      POSTGRES_PASSWORD: e2epassword
      POSTGRES_DB: e2edb
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - "5433:5432"
    healthcheck:
      # Answer a real query over TCP. Two properties matter, and a plain
      # `pg_isready` over the unix socket has neither:
      #
      #   TCP — the postgres entrypoint runs first-boot initdb behind a TEMP
      #   server started with `listen_addresses=''` (see docker-entrypoint.sh,
      #   docker_temp_server_start), which answers on the socket but never on
      #   TCP. A socket probe therefore reports healthy for a server that is
      #   about to be stopped and restarted, and the migrate one-shot — gated
      #   on this healthcheck — races it and dies against a database that is
      #   still starting up.
      #
      #   A query, not a ping — `pg_isready` only asks whether the postmaster
      #   answers. `SELECT 1` proves the database itself is serving.
      #
      # Credentials come from the container's own POSTGRES_* env, so this
      # string is copyable verbatim. `$$` escapes Compose's host-side
      # interpolation. Everywhere the same defect had to be closed:
      #
      #   - docker-compose.dispatch.yml  (per-worktree dev stack) — this exact
      #     string, verbatim; that stack also hardcodes its credentials and
      #     starts from a fresh volume, so the query costs it nothing
      #   - docker-compose.yml           (local dev) — TCP, but a `pg_isready`
      #     PING rather than this query
      #   - .github/workflows/ci.yml     (`migration-reversibility` postgres
      #     service) — likewise a TCP ping, as `docker create --health-*`
      #     options rather than Compose keys
      #
      # Only the TCP-ness is universal. Both of those files explain in place
      # why authenticating would be wrong for them; do not "restore" the query
      # there without reading those reasons.
      #
      # Copies rather than one shared `extends:` fragment. `extends` across
      # files is a Compose v2.20-era feature, and these files have to parse on
      # whatever Compose a CI runner or a contributor happens to have (the same
      # portability floor that rules out `start_interval`, below). It would
      # also cover only the Compose copies and not the CI one, so this list has
      # to exist either way.
      #
      # NOT fixed, and still carrying the window described above on an empty
      # volume, all of them still on the socket probe:
      #
      #   - docker-compose.prod.yml, docker-compose.stage.yml
      #   - the wait loops in backend/scripts/deploy.sh, deploy-stage.sh and
      #     deploy-production.sh, which run migrate against those files
      #   - backend/scripts/update-production.sh, which runs migrate with no
      #     wait loop at all and leans entirely on the prod healthcheck
      #   - backend/scripts/verify.sh, report-only, so it can print a healthy
      #     database that is not yet serving
      #
      # Deferred rather than judged safe. Nothing in CI invokes any of them and
      # prod/stage deploy via Railway, so whether that compose path is still
      # live is the question to settle before touching it.
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1" > /dev/null',
        ]
      # A cold initdb under host load takes far longer than interval*retries.
      # Probe failures inside start_period don't count toward `retries`, so a
      # slow first boot no longer flips the container to `unhealthy` — which
      # would strand migrate in `created` forever, since NO caller passes
      # `--wait`: not frontend/e2e/global-setup.ts, not
      # scripts/dispatch/stack-up.sh, and not the local-dev `docker compose up
      # -d db migrate` in backend/README.md. `start_interval` would let the
      # probe run faster during start_period only; it is deliberately NOT used,
      # for the portability reason given above. `interval: 5s` is the
      # compromise: it costs a few seconds of detection granularity on a cold
      # boot and cuts the probe traffic the container generates for the rest of
      # the run.
      #
      # The cost of start_period is on the failure path: a database that never
      # comes up is not declared `unhealthy` until start_period plus
      # retries*interval, so ~170s here rather than the ~25s a bare
      # interval*retries would give. That is the trade for not flaking on a
      # slow cold boot.
      start_period: 120s
      interval: 5s
      timeout: 10s
      retries: 10

  migrate:
    image: migrate/migrate:latest
    volumes:
      - ./db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://e2euser:e2epassword@db:5432/e2edb?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
