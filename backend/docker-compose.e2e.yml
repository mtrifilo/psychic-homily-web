services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: e2euser
      POSTGRES_PASSWORD: e2epassword
      POSTGRES_DB: e2edb
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - "5433:5432"
    healthcheck:
      # Answer a real query over TCP. Two properties matter, and a plain
      # `pg_isready` over the unix socket has neither:
      #
      #   TCP — the postgres entrypoint runs first-boot initdb behind a TEMP
      #   server started with `listen_addresses=''` (see docker-entrypoint.sh,
      #   docker_temp_server_start), which answers on the socket but never on
      #   TCP. A socket probe therefore reports healthy for a server that is
      #   about to be stopped and restarted, and the migrate one-shot — gated
      #   on this healthcheck — races it and dies against a database that is
      #   still starting up.
      #
      #   A query, not a ping — `pg_isready` only asks whether the postmaster
      #   answers. `SELECT 1` proves the database itself is serving.
      #
      # Credentials come from the container's own POSTGRES_* env, so this
      # string is copied verbatim into every other stack that gates a migrate
      # one-shot on postgres becoming healthy. `$$` escapes Compose's host-side
      # interpolation. The full set of copies to keep in sync:
      #
      #   - docker-compose.dispatch.yml  (per-worktree dev stack)
      #   - docker-compose.yml           (local dev)
      #   - .github/workflows/ci.yml     (`migration-reversibility` job's
      #     postgres service; `docker create --health-*` options rather than
      #     Compose keys, and a TCP `pg_isready` rather than this psql query,
      #     because GitHub tokenizes the `options` string before docker sees
      #     it and nested quotes are not safe to rely on there)
      #
      # docker-compose.prod.yml and docker-compose.stage.yml are NOT in that
      # set. Both still use the socket `pg_isready` with `start_period: 60s`,
      # untouched by PSY-1741 and PSY-1789, so both still carry the first-boot
      # window described above on an empty volume. Left alone on purpose (they
      # are not part of any developer or CI provisioning path), not overlooked.
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1" > /dev/null',
        ]
      # A cold initdb under host load takes far longer than interval*retries.
      # Probe failures inside start_period don't count toward `retries`, so a
      # slow first boot no longer flips the container to `unhealthy` — which
      # would strand migrate in `created` forever, since neither compose caller
      # passes `--wait`. `start_interval` would let the probe run faster during
      # start_period only; it is deliberately NOT used, because it is a newer
      # schema field and this file has to parse on whatever Compose a CI runner
      # or a contributor happens to have. `interval: 5s` is the compromise: it
      # costs a few seconds of detection granularity on a cold boot and cuts
      # the probe traffic the container generates for the rest of the run.
      start_period: 120s
      interval: 5s
      timeout: 10s
      retries: 10

  migrate:
    image: migrate/migrate:latest
    volumes:
      - ./db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://e2euser:e2epassword@db:5432/e2edb?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
