services:
  db:
    image: postgres:18
    restart: always
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Probe over TCP, not the default unix socket, for the reason written out
      # in full on the db healthcheck in docker-compose.e2e.yml: first-boot
      # initdb runs behind a TEMP server with `listen_addresses=''`, which
      # answers on the socket but never on TCP, so a socket probe reports
      # healthy for a server that is about to be stopped and restarted, and the
      # migrate one-shot below races it.
      #
      # Deliberately a `pg_isready` PING and NOT that file's authenticating
      # `psql ... SELECT 1`. The two stacks differ in a way that flips which
      # probe is correct:
      #
      #   e2e and dispatch hardcode POSTGRES_* in `environment:` and start from
      #   a fresh volume every run, so credentials cannot drift and the extra
      #   assurance of a real query is free.
      #
      #   This file host-interpolates POSTGRES_* from backend/.env, and its
      #   `postgres_data` volume PERSISTS. postgres ignores POSTGRES_* on an
      #   already-initialized volume, and `docker compose` names this project
      #   `backend` from the directory, so every worktree and the main checkout
      #   share the one `backend_postgres_data`. A rotated password or a
      #   per-worktree .env therefore leaves the volume's baked-in credentials
      #   disagreeing with the current ones. An authenticating probe turns that
      #   into a healthcheck that can never pass: `migrate` stays gated, the
      #   stack fails after start_period + retries*interval (~170s) with
      #   `dependency failed to start ... is unhealthy`, and the real cause
      #   (`FATAL: role "..." does not exist`) is only in `docker inspect`.
      #   A ping stays green, lets `migrate` run, and lets IT print the actual
      #   error in seconds. Measured: ~11s and a named cause, versus ~171s and
      #   an opaque one.
      #
      # `pg_isready` does not authenticate, so -U/-d would be decorative here;
      # they are omitted rather than implying a check that does not happen.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432']
      start_period: 120s
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  migrate:
    image: migrate/migrate:latest
    command:
      [
        '-path',
        '/migrations',
        '-database',
        'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable',
        'up',
      ]
    env_file:
      - .env.development
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    env_file:
      - .env.development
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '8081:80'
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
