[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# LIVENESS ONLY — do NOT point this at /health/ready.
#
# This gates a NEW deployment going live: if it never returns 200 the deploy is
# marked failed and the previous deployment keeps serving. Railway does not poll
# it once a deployment is live, so it is not a runtime monitor.
#
# /health returns 200 whenever the process is serving, even with the database
# down, and that is deliberate. A dependency-aware value here would add nothing:
# the server already log.Fatalf's at boot when it cannot reach the database, so
# a deployment with a broken dependency never reaches this check anyway. It
# would only couple the deploy gate to a runtime condition.
#
# /health/ready is the 503-on-dependency-failure endpoint, for external uptime
# monitoring — it pages a human and gates no deploy.
# See internal/api/handlers/system/health.go.
#
# Volume sizing is NOT configured here. Run scripts/check-volume-headroom.sh
# before provisioning; see backend/README.md "Infrastructure Sizing and
# Monitoring" for the floor rule that a disk-full outage produced.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
