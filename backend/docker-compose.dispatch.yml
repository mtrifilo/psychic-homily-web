services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: dispatchuser
      POSTGRES_PASSWORD: dispatchpassword
      POSTGRES_DB: dispatchdb
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      # Identical to the db healthcheck in docker-compose.e2e.yml — the
      # rationale for every field lives there. Keep the two in sync; the probe
      # reads the container's own POSTGRES_* env precisely so this block can be
      # copied verbatim.
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1" > /dev/null',
        ]
      start_period: 120s
      interval: 5s
      timeout: 10s
      retries: 10

  migrate:
    image: migrate/migrate:latest
    volumes:
      - ./db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://dispatchuser:dispatchpassword@db:5432/dispatchdb?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
