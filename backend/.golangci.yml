# golangci-lint v2 configuration for the Psychic Homily backend.
#
# Rollout posture (PSY-772):
#   Phased — cheap linters with zero (or near-zero) violations are gated as
#   errors and FAIL CI. Linters with a meaningful pre-existing backlog run
#   in a separate ADVISORY job (continue-on-error: true) so they surface
#   findings without blocking PRs. As each backlog is cleaned, the linter
#   moves from the advisory list to the gated list in a follow-up PR.
#
# Two configs, two CI steps:
#   * this file (.golangci.yml)             — gated linters; non-zero exit fails CI.
#   * .golangci-advisory.yml                — advisory linters; soft-fail in CI.
#
# Violation survey (2026-05-23, golangci-lint v2.12.2; errorlint updated 2026-05-24,
# ineffassign updated 2026-05-24, staticcheck updated 2026-05-24, unused updated 2026-05-24,
# errcheck updated 2026-05-25):
#   linter       | violations | decision  | rationale
#   ----------- | ---------- | --------- | ------------------------------------------------
#   govet        |          0 | GATE      | clean once the `inline` analyzer (advisory
#                |            |           | suggestion to swap `reflect.Ptr` → `reflect.Pointer`)
#                |            |           | is disabled — see settings below.
#   errorlint    |          0 | GATE      | PSY-762 codemodded 193 `err == gorm.ErrRecordNotFound`
#                |            |           | sites (189 in source-Go + 4 in cmd/scaffold templates)
#                |            |           | to `errors.Is(...)` via `gofmt -r`, then cleaned up
#                |            |           | the 13 stragglers (5 fmt.Errorf %v→%w in cmd/seed +
#                |            |           | 8 test-file `err.(*T)`→`errors.As(err, &v)`). Gated
#                |            |           | to prevent regression of err-wrap discipline.
#   ineffassign  |          0 | GATE      | PSY-830 cleaned the 4 sites (3 dead assignments
#                |            |           | deleted, 1 wasted allocation swapped for nil-slice
#                |            |           | declaration). Gated to prevent regression of
#                |            |           | ineffective-assignment patterns.
#   staticcheck  |          0 | GATE      | PSY-832 cleaned the 32 sites (5 SA4006 dead
#                |            |           | baseQuery reassignments deleted, 17 QF style
#                |            |           | suggestions autofixed via `--fix` + 1 manual
#                |            |           | De Morgan rewrite extracted to a named predicate,
#                |            |           | 8 ST1005 error-string capitalization/punctuation
#                |            |           | fixes, 1 S1011 slice-append + 1 ST1023 redundant
#                |            |           | type-decl autofixes). Gated to prevent regression
#                |            |           | of staticcheck-clean patterns.
#   unused       |          0 | GATE      | PSY-831 deleted all 25 sites — 14 dead test
#                |            |           | helpers (3 duplicate handler factories, 5 unused
#                |            |           | non-admin context helpers, 1 dead JWT claims
#                |            |           | helper, 4 dead pointer/sort helpers + 1 dead
#                |            |           | suite-method on RadioServiceIntegrationTestSuite),
#                |            |           | 1 dead production hashEmail (notification.HashEmail
#                |            |           | is the canonical impl already called from the same
#                |            |           | file), 3 dead production types (festivalNameRow,
#                |            |           | local editionArtist, local showVenueKey — declared
#                |            |           | but never instantiated), 1 dead production const
#                |            |           | (venueBillSparseShowsThreshold — frontend mirrors
#                |            |           | the threshold itself, backend never read its own
#                |            |           | const), 1 dead production OAuth wrapper method
#                |            |           | (transitional shim around …WithConsent never wired
#                |            |           | back in after the consent path replaced it). Gated
#                |            |           | to prevent dead-code regression.
#   errcheck     |          0 | GATE      | PSY-833 (umbrella) cleared via 4-phase split —
#                |            |           | PSY-846/847/848/849. Roughly 481 sites resolved
#                |            |           | across all four phases:
#                |            |           |  * Phase 1 (PSY-846, #817): 276 testify-suite
#                |            |           |    err drops → s.Require().NoError(err).
#                |            |           |  * Phase 2 (PSY-847, #825): 125 HTTP write/encode
#                |            |           |    drops via the new respond.SafeWrite /
#                |            |           |    respond.SafeEncode helper.
#                |            |           |  * Phase 3 (PSY-848, #827): 22 json.Unmarshal
#                |            |           |    drops in tests → require.NoError(t, ...).
#                |            |           |  * Phase 4 (PSY-849, this PR): 58 long-tail
#                |            |           |    sites — 2 bcrypt timing-mitigation calls
#                |            |           |    annotated with preserved security comments,
#                |            |           |    2 silent IncrementFailedAttempts /
#                |            |           |    ResetFailedAttempts errors switched to
#                |            |           |    structured logging, ~27 uniform best-effort
#                |            |           |    annotations (resp.Body.Close, os.Setenv/
#                |            |           |    Unsetenv, rows.Close, Container.Terminate),
#                |            |           |    and ~27 testify-suite + bare-t fixture
#                |            |           |    drops resolved with NoError calls. Gated to
#                |            |           |    prevent regression of error-discipline.
#   forbidigo    |          0 | GATE      | The only SCOPED entry: a path-except exclusion
#                |            |           | confines it to the three auth packages, where the
#                |            |           | standard logger is banned outright. The rest of the
#                |            |           | tree still prints through it in places, so a
#                |            |           | repo-wide forbidigo would not be a gate today.
#
# Note on the PSY-760 attribution-deref rule:
#   PSY-760 wants a custom rule that flags direct user.{Username,FirstName,Email}
#   reads outside services/shared/ (forces callers to go through the resolver
#   chain). The natural home is a `forbidigo` block here, but the rule depends
#   on PSY-760 landing first. The skeleton is commented out below; when PSY-760
#   merges, un-comment + tune the path-exclude pattern.

version: "2"

run:
  # Total work timeout. Wall-time survey on this codebase is ~5s for the full
  # set; 5m gives plenty of margin without letting a future blow-up linger.
  timeout: 5m

linters:
  # Start with NO defaults; the survey above is the source of truth for which
  # linters belong in which tier.
  default: none
  enable:
    - govet
    - errorlint
    - ineffassign
    - staticcheck
    - unused
    - errcheck
    - forbidigo

  settings:
    forbidigo:
      # The exclusion rule below is what confines these patterns to the auth
      # packages; they are written as if repo-wide.
      #
      # Those packages handle provider tokens, session JWTs, cookie values, and
      # addresses. The standard logger writes whatever it is handed, at no level
      # and with no redaction, so a %v on a goth.User, a cookie, or an error
      # carrying a token URL ships the credential to the log stream. The
      # logger.Auth* helpers are level-gated and carry the request id, and their
      # call sites pass projections (logger.HashEmail, utils.RedactErrorURL,
      # observability.ScrubText) rather than whole values.
      forbid:
        - pattern: '^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$'
          msg: "auth packages log through logger.Auth{Debug,Info,Warn,Error}, which is level-gated and redaction-aware; the standard logger writes credentials verbatim"
        - pattern: '^fmt\.Print(f|ln)?$'
          msg: "auth packages log through logger.Auth{Debug,Info,Warn,Error}; fmt.Print* writes to stdout unredacted and ungated"
        - pattern: '^print(ln)?$'
          msg: "auth packages log through logger.Auth{Debug,Info,Warn,Error}; the print builtins write to stderr unredacted and ungated"

    govet:
      # govet ships with an `inline` analyzer that suggests rewriting
      # `reflect.Ptr` (deprecated constant) as `reflect.Pointer`. The 3 hits
      # are in services/shared/revisiondiff/*.go and are purely cosmetic.
      # Disabling keeps govet clean as a gate; the broader inline-vs-name
      # cleanup belongs in a typed-constants follow-up, not in this config.
      disable:
        - inline

  exclusions:
    rules:
      # forbidigo is scoped, not repo-wide: a path-except rule drops every
      # forbidigo issue OUTSIDE these three package trees. Adding a fourth
      # package to the guard means adding it to this alternation.
      #
      # Paths are matched against the file path golangci reports, which is
      # relative to this config's directory (backend/), so the leading
      # `internal/` is correct here and a `backend/` prefix would match nothing.
      # Test files are in scope too: a credential printed from a test still
      # reaches CI output.
      - linters:
          - forbidigo
        path-except: '^internal/(services/auth|api/handlers/auth|services/user)/'

  # The PSY-760 placeholder. `settings.forbidigo.forbid` and
  # `exclusions.rules` are live blocks above, so this appends to them; a second
  # copy of either key would silently replace the auth guard. The pattern goes
  # in the forbid list:
  #
  #       - pattern: 'user\.(Username|FirstName|Email)'
  #         msg: "use services/shared.Resolve* helpers, not direct field deref (PSY-760)"
  #
  # Its scope is the inverse of the auth guard's: repo-wide except
  # services/shared, rather than auth-only. The auth rule's path-except drops
  # every forbidigo issue outside the three auth trees, this one included, so
  # the two cannot share that single exclusion. Resolving that is part of
  # PSY-760, not a detail to discover at merge time.
