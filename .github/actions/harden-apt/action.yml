name: Harden apt
description: >-
  Remove the degraded Azure apt mirror and bound apt fetch stalls before any
  apt-consuming step runs. Keeps the apt-hardening logic in one place for the
  jobs that consume apt.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Two distinct incident classes on 2026-08-19 (PSY-1877), diagnosed
        # from the run logs rather than one hypothesis:
        #   1. azure.archive.ubuntu.com serving ~53 kB/s (21.1 MB in 6m38s,
        #      job 95976410062). Removing the azure mirrorlist entry promotes
        #      the https archive/security entries the image also lists. The
        #      removal is PROVISIONAL, not a permanent verdict on the mirror:
        #      PSY-1881 tracks re-measuring it and reverting if healthy.
        #   2. A silent 3m32s stall on archive.ubuntu.com AFTER apt had
        #      already failed over past azure (job 96001080157). Bounded by
        #      the 20s idle timeout + explicit retries below, and ultimately
        #      by the caller's step timeout.
        # On image drift this WARNS and degrades (to the image default, or to
        # no hardening at all) instead of hard-failing every consumer job;
        # the warning annotation is the signal to revisit this action.
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          if ! grep -q 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
            echo "::warning::azure mirror not present in apt-mirrors.txt; runner image reshaped, revisit PSY-1881 (mirror removal, provisional)"
          fi
          cp /etc/apt/apt-mirrors.txt "${RUNNER_TEMP:-/tmp}/apt-mirrors.txt.bak"
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          if ! grep -qE '^[[:space:]]*[a-z]+://' /etc/apt/apt-mirrors.txt; then
            echo "::warning::no mirrors left after removing azure; restoring the image default"
            sudo cp "${RUNNER_TEMP:-/tmp}/apt-mirrors.txt.bak" /etc/apt/apt-mirrors.txt
          fi
          echo "apt-mirrors.txt after removing azure:"
          cat /etc/apt/apt-mirrors.txt
        else
          echo "::warning::/etc/apt/apt-mirrors.txt missing; azure mirror not removed. azure references elsewhere:"
          grep -rl 'azure\.archive\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            || echo "(none found)"
        fi
        # The 20s value bounds CONNECT/IDLE stalls only; a slow-but-flowing
        # fetch is bounded by the caller's step timeout, not by this.
        # Retries are set explicitly rather than relied on: the image's
        # 80-retries file uses the APT:: prefix apt does not read for this
        # key, and apt's own built-in default has moved between releases.
        # Honest worst case: ONE fully-stalling item costs about
        # Timeout x (Retries+1) x surviving mirrors = 20 x 4 x 2 = 160s
        # (the mirror count is read off the current image, not guaranteed;
        # the cat above records the actual list on every run);
        # the TOTAL across many items is unbounded by design, and cutting
        # that is exactly what the consumers' step timeouts in ci.yml are
        # for. Size a consumer's step timeout comfortably above 160s plus
        # its normal traffic; change these numbers together.
        printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-fetch-timeout > /dev/null
