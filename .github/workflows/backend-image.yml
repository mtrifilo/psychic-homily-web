# PSY-1742: build the backend runtime image on the changes that can break it.
#
# Before this workflow, nothing in CI ran `docker build`. A bad base digest, a
# republished tag that no longer resolves, an apk package renamed out of the
# Alpine index, a `npm ci` the pinned lockfile can no longer satisfy -- every
# one of those first surfaced as a Railway deploy failure on main, after merge.
# Dependabot (.github/dependabot.yml) makes digest changes a routine weekly
# event, so "we find out at deploy time" stopped being an acceptable answer.
#
# ALWAYS-RUN, NOT PATH-FILTERED, and that is the whole design decision.
#
# The obvious shape for this is a `paths:` filter on backend/Dockerfile, and the
# first draft had one. Two things killed it.
#
# First, the footgun. A path-filtered workflow does not report a neutral or
# skipped status on PRs that miss the filter, it reports NOTHING, and a required
# check that never reports blocks the PR forever (PSY-1720's closure note). A
# path filter therefore permanently forecloses making this required, or quietly
# bricks the merge queue for whoever tries.
#
# Second, the cost argument for filtering turned out to be false. Measured on
# this workflow's own first CI run: 77 SECONDS end to end, cold, with no cache
# to restore from. The Go build is 39s of that. (A local `docker build
# --platform linux/amd64` on an arm64 laptop takes 25+ minutes, but that is QEMU
# emulation, not a real signal -- GitHub's runners are native amd64.) That is
# well under the E2E Smoke budget and it runs in parallel with the rest of CI,
# so the wall-clock cost of always running it is approximately zero.
#
# Filtering also has to be RIGHT, and a path list is easy to get wrong: the
# first draft's list silently omitted layout/fa2-layout.mjs. Always-run has no
# list to maintain and no gap to miss, and it additionally covers the case a
# file list cannot express -- a Go source change that builds under `go test` but
# breaks the image.
#
# "Backend Image Build" IS a required status check on main (verified
# 2026-08-26). This comment previously asserted the opposite, describing the
# state before the check was promoted. Do not trust either version of that
# line -- re-derive it:
#
#   gh api repos/mtrifilo/psychic-homily-web/branches/main/protection \
#     --jq '.required_status_checks.contexts'
#
#   >>> While it is required, do NOT add a `paths:` filter to this workflow.
#   >>> A filtered run reports NOTHING (not "skipped") on PRs that miss the
#   >>> filter, and a required check that never reports blocks the PR forever
#   >>> (PSY-1720). Remove it from branch protection FIRST.
name: Backend Image

on:
  pull_request:
    branches: [main]
  # Post-merge too. Two PRs can each be green alone and break the image together
  # (a Dockerfile change on one, a lockfile change on the other), and while this
  # check is required, a PR run can still be merged past with an admin override
  # (enforce_admins is false). This leg catches both, and the
  # notify-image-failure job below is what makes it a backstop rather than a
  # red square nobody is subscribed to -- with the caveat recorded on that
  # job's `if:`: a run that concludes `cancelled` files nothing.
  push:
    branches: [main]

# Superseded PR runs are cancelled: a branch that gets two fixup pushes should
# not hold three concurrent builds. Main-branch runs are never cancelled, since
# each one is the record for a distinct merged commit.
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Workflow-level DEFAULT for the GITHUB_TOKEN, not a floor. Any job declaring
# its own `permissions:` REPLACES this rather than extending it; a job that
# declares none inherits exactly this. See ci.yml's header for the full rule.
#
# No `packages:` scope, and that is a checked fact rather than an oversight:
# this workflow authenticates to DOCKER HUB with secrets.DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN, and builds with `push: false`, so nothing is published
# anywhere. Nothing in this repository references ghcr.io. If this ever starts
# publishing to GitHub Packages, `packages: write` goes in the BUILD JOB's
# block below (next to its `contents: read`), not up here.
permissions:
  contents: read

jobs:
  backend-image:
    name: Backend Image Build
    runs-on: ubuntu-latest
    # `contents: read` and nothing else. The `issues: write` this block used to
    # carry moved to the notify-image-failure job below (PSY-1909), so no write
    # scope is live in a job that checks out and runs third-party actions.
    #
    # This block is now identical to the workflow-level one, so deleting it
    # would be a no-op TODAY -- the job would simply inherit the same
    # `contents: read`. Keep it anyway, because a job-scoped block REPLACES the
    # workflow-level one rather than extending it: the moment any scope is
    # added here, `contents: read` has to already be written down alongside it
    # or the checkout below silently loses its grant. See ci.yml's header.
    permissions:
      contents: read
    # Measured at 77s cold on this workflow's first run. The ceiling is a hung
    # registry pull, not slow compilation, so 10 minutes is already a wide
    # margin -- and a job that has genuinely wedged should free its runner
    # rather than sit for a third of an hour.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Authenticated pulls dodge Docker Hub's anonymous rate limit, which is
      # shared per runner IP. `continue-on-error` mirrors the Backend Tests job:
      # this is an optimization, not a dependency, and it MUST stay non-fatal
      # because Dependabot-authored PRs run against the Dependabot secret store,
      # where these two secrets do not exist. Those are exactly the PRs this job
      # is here to check, so a login failure cannot be allowed to fail them.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - uses: docker/setup-buildx-action@v3

      # Fails in ~10s on a digest that is pinned per-platform rather than
      # per-index -- a break the amd64-only build below cannot see, because it
      # only shows up on the other architecture.
      - name: Assert the pinned digest is a multi-arch manifest list
        run: bash scripts/check_node_base_manifest.sh

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # linux/amd64 only -- it is what Railway builds and what the Go stage
          # hardcodes via GOARCH. Building arm64 too would double the cost to
          # validate a platform nothing deploys.
          platforms: linux/amd64
          # Nothing is published. The question this job answers is only "does
          # this Dockerfile still build", so the result stays in the builder.
          push: false
          cache-from: type=gha,scope=backend-image
          # Written only on main. GitHub's Actions cache is a 10GB per-repo LRU
          # shared with six setup-go caches and the frontend caches in ci.yml,
          # and `mode=max` exports every builder-stage layer (the compiled
          # golang-migrate CLI, the module cache, the linked binary) -- hundreds
          # of MB per run. A PR-ref cache is also unreadable by any other PR, so
          # exporting one buys nothing and evicts caches other jobs depend on.
          # mode=max stays on the main leg: with `push: false` there is no image
          # export, so mode=min would drop exactly the builder layers that carry
          # all the expensive work.
          #
          # This split is what keeps always-run cheap. The overwhelming majority
          # of PRs do not touch the image's inputs at all, so they restore main's
          # cache, hit on every layer, and cost seconds.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend-image' || '' }}

  # A red square in the Actions tab is not a backstop -- nobody is subscribed
  # to it. ci.yml's notify-main-failure job cannot cover this workflow (it can
  # only aggregate `needs:` within its own workflow), so this files into the
  # same `main-ci-failure` triage queue, using only the built-in GITHUB_TOKEN.
  # Deduped on the commit SHA so a rerun storm does not spam.
  #
  # KNOWN SHARP EDGE, not introduced here but now worth naming since the two
  # notifiers are explicit twins: ci.yml's notify-main-failure dedupes against
  # the SAME label and the same SHA substring. On a commit that breaks both the
  # image and CI, whichever job files first suppresses the other -- and this
  # one is far faster, so the richer "Main CI failed" issue is the one that
  # gets swallowed. Give the two notifiers distinct labels or title-scoped
  # dedupe predicates to fix it.
  #
  # PSY-1909 made this its OWN job rather than a final step of the build.
  # As a step it forced `issues: write` onto the whole build job, which does
  # `actions/checkout` (persisting the token into .git/config by default) and
  # then runs three third-party docker/* actions floating on mutable major
  # tags. That put a write scope within reach of any of them, on every run.
  # Splitting costs one extra runner on a rare path and buys a notifier with no
  # checkout, no dependency install, and one first-party github-script step
  # running a repo-controlled inline script.
  #
  # It also makes the "only live on the push leg" claim true BY CONSTRUCTION.
  # The previous comment asserted the token was read-only on pull_request
  # events regardless. That holds only for FORK PRs and for Dependabot (see the
  # Docker Hub login step above, which documents the Dependabot case), not for
  # the same-repo branches this repository's PRs have so far always been -- on
  # those the declared permissions applied in full and the old grant was live.
  # That is an observation about history, not an invariant: the repository is
  # public, so a fork PR is always possible and would get a read-only token.
  notify-image-failure:
    name: Notify on image build failure
    needs: [backend-image]
    # Deliberately the SAME trigger the notify step had before it became a job.
    # This change moves where the `issues: write` scope lives; it does not
    # change when anyone gets paged. `!cancelled()` keeps a human cancelling
    # the run from filing a spurious issue.
    #
    # KNOWN DEFECT, inherited and NOT fixed here: a run whose conclusion is
    # `cancelled` skips this job, so a build that never reports a result pages
    # nobody. Measured on ci.yml's twin notifier, which uses the same shape:
    # runs 32224865384, 32224821219 and 32224846260 each concluded `cancelled`
    # with killed E2E shards, each shows "Notify on main CI failure: skipped",
    # and no `main-ci-failure` issue exists for any of those three commits.
    # (Those shards were killed by GitHub's platform job cap, which was the
    # only cap they had at the time; whether a `timeout-minutes` kill produces
    # the same run conclusion is NOT established by those runs.)
    #
    # Fixing it means changing when BOTH notifiers page, and widening this one
    # alone would make it file on human cancels, where the shared `main-ci-
    # failure` dedupe below would then suppress ci.yml's richer issue for the
    # same SHA. That is a behavior change with its own blast radius, so it
    # belongs in its own ticket rather than riding a permissions change.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.backend-image.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `issues: write` alone is the complete set, and the reason is that no call
    # below is contents-scoped -- the script reads everything it reports off
    # the `context` object. It is NOT "because there is no checkout": ci.yml's
    # notify-main-failure has no checkout either and still needs
    # `contents: read`, because it calls repos.getCommit. If you enrich this
    # issue body with commit metadata, add `contents: read` here at the same
    # time; on this public repo the omission would appear to work and would
    # break only when the repository is flipped private.
    #
    # NOT exercised by the PR that introduced it: this job needs a failing
    # image build on main. Verify on the first post-merge failure, or force one
    # deliberately.
    permissions:
      issues: write
    steps:
      - name: File a tracking issue on main-branch failure
        uses: actions/github-script@v7
        with:
          script: |
            const shortSha = context.sha.substring(0, 7)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'main-ci-failure',
              state: 'open',
              per_page: 50,
            })
            if (existing.some(i => i.title.includes(shortSha))) {
              core.info(`Open issue already references ${shortSha}; skipping.`)
              return
            }

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Backend image build failed on main (${shortSha})`,
              body: [
                'The backend runtime image no longer builds from `main`.',
                '',
                'Railway builds this same Dockerfile, so the next backend deploy will fail until this is fixed.',
                '',
                `**Run:** ${runUrl}`,
                `**Commit:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`,
                '',
                '---',
                '',
                'Filed automatically by the `backend-image` workflow (PSY-1742).',
              ].join('\n'),
              labels: ['main-ci-failure'],
            })
            core.info(`Filed issue #${created.number}: ${created.html_url}`)
