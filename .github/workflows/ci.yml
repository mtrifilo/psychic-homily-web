name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  migration-lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate migration version numbers
        run: |
          DUPS=$(ls backend/db/migrations/*.up.sql \
                 | sed -E 's|.*/([0-9]+)_.*|\1|' \
                 | sort | uniq -d)
          if [ -n "$DUPS" ]; then
            echo "ERROR: duplicate migration version number(s) detected:"
            for v in $DUPS; do
              echo "  version $v:"
              ls backend/db/migrations/${v}_*.up.sql | sed 's|^|    |'
            done
            echo ""
            echo "golang-migrate refuses to start with duplicate versions."
            echo "Rename one of the conflicting migrations to a new, higher version."
            exit 1
          fi

      - name: Check every up.sql has a matching down.sql
        run: |
          MISSING=""
          for up in backend/db/migrations/*.up.sql; do
            down="${up%.up.sql}.down.sql"
            if [ ! -f "$down" ]; then
              MISSING="$MISSING $up"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: up migrations without matching down migration:"
            for m in $MISSING; do echo "  $m"; done
            exit 1
          fi

      # PSY-869: every entity_type the entity_requests CHECK constraint accepts
      # must have a matching Go payload struct (and vice versa). Catches a new
      # enum value added in a migration without a typed payload to validate it.
      - name: Check entity_requests payload-struct parity
        run: bash scripts/check_entity_request_payloads.sh

      # PSY-1708 (stage outage 2026-08-02): two parallel branches stamped their
      # migrations in author-time order but merged in the reverse order.
      # golang-migrate silently skips any migration at or below the current
      # schema_migrations pointer (it reports "no change" and exits 0), so the
      # earlier-stamped file never applied and every stage deploy failed for
      # four hours. The checks above cannot see this: they inspect a file in
      # isolation, and the defect is the timestamp relative to what is MERGED.
      #
      # These steps run LAST in the job because the shallow `git fetch` below
      # touches repository state the earlier file-tree checks do not need.
      - name: Self-test the migration timestamp gate
        run: bash scripts/check_migration_timestamps_test.sh

      # actions/checkout leaves a depth-1 clone with no origin/main ref on a
      # pull_request event, so fetch the one ref the gate compares against.
      # Keep --depth=1: the gate diffs two tip trees and never walks history.
      - name: Fetch origin/main for the migration timestamp gate
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Check new migration timestamps exceed the merged maximum
        run: bash scripts/check_migration_timestamps.sh origin/main

  migration-reversibility:
    name: Migration Reversibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Probe over TCP (`-h 127.0.0.1`), not the default unix socket. The
        # postgres entrypoint runs first-boot initdb behind a temp server
        # started with `listen_addresses=''`, which answers on the socket but
        # never on TCP. A socket probe therefore reports healthy for a server
        # that is about to be stopped and restarted, and the steps below (which
        # the runner gates on this health state) race it against a database
        # that is still starting up. Same defect, and same fix, as the db
        # healthcheck in backend/docker-compose.e2e.yml; keep them in sync.
        #
        # That file's probe runs `psql -tAc 'SELECT 1'`. This one cannot:
        # GitHub tokenizes the `options` string before `docker create` sees it,
        # so the nested quotes a quoted SQL argument needs are not safe to rely
        # on. TCP `pg_isready` is the quote-free equivalent. It reports
        # PQPING_REJECT (non-zero) while the postmaster is still starting up,
        # so it also goes green only once the real server takes connections.
        #
        # --health-start-period: probe failures inside it do not count toward
        # --health-retries, so a slow cold initdb cannot burn the retry budget
        # and flip the service to unhealthy.
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -p 5432 -U test -d test"
          --health-start-period=60s
          --health-interval=5s
          --health-timeout=10s
          --health-retries=10
    env:
      DB_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Install migrate CLI (v4.19.1 — match production Dockerfile)
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz \
            | tar xz
          sudo mv migrate /usr/local/bin/migrate
          migrate -version

      - name: migrate up (fresh DB)
        run: migrate -path backend/db/migrations -database "$DB_URL" up

      - name: migrate down -all (back to empty)
        run: migrate -path backend/db/migrations -database "$DB_URL" down -all

      - name: migrate up (re-apply all)
        run: migrate -path backend/db/migrations -database "$DB_URL" up

      - name: Assert expected version
        run: |
          EXPECTED=$(ls backend/db/migrations/*.up.sql \
                     | sed -E 's|.*/([0-9]+)_.*|\1|' \
                     | sort -n | tail -1 | sed 's/^0*//')
          ACTUAL=$(PGPASSWORD=test psql -h localhost -U test -d test -tAc \
                   "SELECT version FROM schema_migrations ORDER BY version DESC LIMIT 1")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: schema_migrations.version=$ACTUAL but expected $EXPECTED"
            exit 1
          fi
          echo "OK: schema_migrations.version=$ACTUAL matches newest migration file"

      # PSY-413: `CREATE INDEX CONCURRENTLY` inside a multi-statement migration
      # silently fails (golang-migrate wraps multi-statement files in a
      # transaction, and CONCURRENTLY can't run in one). Our convention is
      # "one CONCURRENTLY statement per file" — see docs/strategy/migrations.md.
      # This step catches any future regression where the index stops being
      # created (e.g. if someone accidentally merges the CONCURRENTLY stmt
      # into a larger migration file). The `schema_migrations` assertion
      # above would still pass in that scenario because `IF NOT EXISTS`
      # swallows the error.
      - name: Assert CONCURRENTLY migration created its index
        run: |
          ACTUAL=$(PGPASSWORD=test psql -h localhost -U test -d test -tAc \
                   "SELECT indexname FROM pg_indexes WHERE indexname = 'idx_shows_duplicate_of_show_id';")
          if [ "$ACTUAL" != "idx_shows_duplicate_of_show_id" ]; then
            echo "ERROR: idx_shows_duplicate_of_show_id missing after migrate up"
            echo "Migration 000027 uses CREATE INDEX CONCURRENTLY. Check that the"
            echo "statement is the only statement in its migration file."
            exit 1
          fi
          echo "OK: CONCURRENTLY index idx_shows_duplicate_of_show_id exists"

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PSY-1742. This job is a REQUIRED check that runs on every PR, which
      # makes it the right place for the two sub-second gates below: the pin is
      # validated before any runner minutes are spent, and a bad pin blocks the
      # merge rather than producing a note nobody reads.
      - name: Self-test the Node base-pin gate
        run: bash scripts/check_node_base_pin_test.sh

      # DERIVED, NOT DUPLICATED. backend/Dockerfile is the single source of
      # truth for the Node version (see the NODE PIN comment there); the
      # graph-layout step below consumes this output instead of restating the
      # version as a literal. That is what makes a Dependabot base-image PR a
      # COMPLETE bump: it edits the Dockerfile, CI follows automatically, and
      # there is no second value that can be left behind. The script validates
      # the pin's shape before printing, so a dropped digest or a floated tag
      # fails here.
      - name: Resolve the pinned Node version from backend/Dockerfile
        id: node_pin
        run: |
          version=$(bash scripts/check_node_base_pin.sh --print-version)
          echo "Derived node $version from backend/Dockerfile"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: go test -coverprofile=coverage.out ./...

      # PSY-1723: the nightly graph-overview layout runs in a Node subprocess
      # (backend/layout), and its test suite is the ONLY coverage of the
      # ForceAtlas2 contract the map's stability rests on — determinism on
      # identical input, the undocumented `fixed` node attribute, and the
      # float32 round-trip that makes an unchanged night reproduce an identical
      # map. Every Go test stubs the runner, so without this step a dependency
      # bump that silently drops `fixed` would go green.
      #
      # Read out of backend/Dockerfile by the node_pin step above, NOT written
      # here, so this suite always exercises the V8 that production runs. The
      # version is deliberately not visible in this file: it is not
      # independently choosable, and writing it down is what let it drift.
      # `scripts/check_node_base_pin.sh` prints the current value.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_pin.outputs.version }}
          cache: npm
          cache-dependency-path: backend/layout/package-lock.json

      - name: Run graph-layout worker tests
        working-directory: ./backend/layout
        run: |
          npm ci
          node --test

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.out
          flags: backend
          disable_search: true
          # PSY-976: don't let a flaky Codecov *upload* block merges. The
          # action's GPG uploader-key import fails intermittently (upstream
          # codecov/codecov-action#1876) — a transient upload error must not
          # fail an otherwise-green job. `go test` above still gates real
          # test failures; this only relaxes the post-test upload step.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # PSY-772: backend lint gate.
  #   * Gated linters (.golangci.yml) — fail the job on any finding. Currently
  #     govet (inline analyzer disabled), errorlint, ineffassign, staticcheck,
  #     unused, errcheck. All linters surveyed clean as of 2026-05-25.
  #   * Advisory tier (.golangci-advisory.yml) — REMOVED by PSY-849. The
  #     graduation series (PSY-762/830/831/832/833) cleared every advisory
  #     linter; all 5 are now gated. Re-add the file + a second action step
  #     if a future linter needs an advisory phase.
  # Wall-time on the survey was ~6s for the full set — well inside the
  # ~10-min PR CI budget. golangci-lint-action handles its own module + build
  # cache, independent of the test job's setup-go cache.
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Run gated linters
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
          args: --config=.golangci.yml

  # PSY-771/PSY-794: the committed testhelpers/mocks_gen.go is generated. It
  # drifted from its generator once before, so this job re-runs the generator
  # and fails if the committed file differs — cheap (no DB, just the generator).
  # The generator is self-formatting (go/format) and writes the file itself via
  # a cwd-independent `//go:generate` directive, so `go generate ./...` is the
  # single source of truth (no separate gofmt step).
  mocks-gen-check:
    name: Mocks Generator Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Regenerate mocks and assert no drift
        working-directory: ./backend
        run: |
          go generate ./...
          if ! git diff --exit-code -- internal/api/handlers/shared/testhelpers/mocks_gen.go; then
            echo ""
            echo "ERROR: mocks_gen.go is stale relative to its generator."
            echo "Regenerate and commit the result:"
            echo "  cd backend && go generate ./..."
            exit 1
          fi
          echo "OK: mocks_gen.go matches go generate output"

  # PSY-1550: the frontend's API types are GENERATED from the backend's OpenAPI
  # document, not hand-written. This regenerates them and fails if the committed
  # file differs — i.e. the backend contract moved and the frontend was not
  # regenerated.
  #
  # This is the check that would have caught PSY-1547, where a hand-written type
  # read `collection_items` while the wire sent `crate_items`: tsc validated the
  # code against a fiction, the test mock repeated the same fiction, and CI was
  # fully green while the admin console was down in production.
  #
  # Hermetic on purpose: the spec comes from `go run ./cmd/openapi-spec`, which
  # builds the real router with a nil DB. No server, no database, nothing to be
  # up — so this cannot become the flaky job everyone disables.
  api-types-check:
    name: API Types Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Regenerate API types and assert no drift
        run: |
          bash scripts/gen-api-types.sh
          if ! git diff --exit-code -- frontend/types/api.d.ts; then
            echo ""
            echo "ERROR: frontend/types/api.d.ts is stale relative to the backend's OpenAPI spec."
            echo "The API contract changed without the frontend types being regenerated."
            echo "Regenerate and commit the result:"
            echo "  cd frontend && bun run api:types"
            exit 1
          fi
          echo "OK: frontend/types/api.d.ts matches the backend spec"

  # PSY-1679: split the unit suite across 4 parallel shards. It was a single
  # ~10.5min job and the long pole in CI.
  #
  # Sharding works here because the cost is PER FILE, not per test: 667 files /
  # 8254 tests, and vitest's own accounting was `environment 522s · setup 349s ·
  # tests 517s`. Every file builds a fresh jsdom and re-runs test/setup.ts (MSW
  # listen, the Sentry mock, the matchMedia / IntersectionObserver /
  # ResizeObserver stubs). That overhead parallelises almost linearly.
  #
  # Typecheck deliberately does NOT live here any more — it moved to
  # frontend-lint so it runs once instead of four times. It had to land on
  # another REQUIRED check, not a new job, or a type error would silently stop
  # blocking merges.
  frontend-unit-shards:
    name: Frontend Unit Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure must not cancel the others: a green sibling is how
      # you tell "this shard's tests broke" from "the whole suite is broken".
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        working-directory: ./frontend
        run: bun run test:coverage -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          # Every shard uploads its PARTIAL lcov under the same flag; Codecov
          # merges uploads sharing a flag on one commit. Splitting the flag per
          # shard would instead report four separate partial coverages.
          flags: frontend
          disable_search: true
          # PSY-976: see backend upload above — a flaky Codecov upload
          # (codecov/codecov-action#1876) must not fail an otherwise-green
          # job. `bun run test:coverage` still gates real test failures.
          fail_ci_if_error: false
          working-directory: ./frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  # PSY-1679: the required-check shim. `Frontend Unit Tests` is a REQUIRED status
  # check on main, and required contexts are matched BY NAME. Sharding alone would
  # have renamed it to "Frontend Unit Shard 1/4" etc., the required context would
  # never report again, and every PR would silently become unmergeable.
  #
  # So this job keeps the name verbatim and just reports the matrix's verdict.
  # `needs` on a matrix job aggregates: `success` only if every shard succeeded.
  # `always()` is required or a failed shard would SKIP this job, and a skipped
  # required check never reports either — the same breakage by another route.
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [frontend-unit-shards]
    if: ${{ always() }}
    steps:
      - name: Report shard results
        run: |
          echo "shard matrix result: ${{ needs.frontend-unit-shards.result }}"
          if [ "${{ needs.frontend-unit-shards.result }}" != "success" ]; then
            echo "::error::One or more frontend unit-test shards failed — see the 'Frontend Unit Shard N/4' jobs."
            exit 1
          fi
          echo "All 4 frontend unit-test shards passed."

  # PSY-955: frontend ESLint gate. Runs the bare `bun run lint` (= `eslint`),
  # which exits non-zero on ERRORS only — it does NOT fail on warnings. There
  # are ~154 pre-existing warnings that are intentionally NOT gated here; do
  # NOT add `--max-warnings` or it will immediately re-break CI on those.
  # PSY-953 (#964) cleared lint errors to 0, so this gate starts green.
  # Branch-protection / required-check config is handled outside this workflow.
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      # PSY-1679: typecheck moved here from frontend-unit-tests when that job was
      # sharded 4x — running it in the matrix would have run it four times for
      # one answer. It landed HERE specifically because `Frontend Lint` is also a
      # REQUIRED check: parking it in a new non-required job would have run it
      # while quietly no longer blocking a merge on a type error.
      #
      # It runs BEFORE lint because tsc is the stricter gate and the faster
      # signal (~33s), so a type error fails the job without waiting on eslint.
      - name: Typecheck (tsc --noEmit)
        working-directory: ./frontend
        run: bun run typecheck

      - name: Lint (eslint)
        working-directory: ./frontend
        run: bun run lint

  e2e-smoke:
    name: E2E Smoke (PR)
    # PSY-446: fast PR feedback. Runs only `@smoke`-tagged Playwright tests
    # in a single unsharded run (~17 tests) with a <3 min wall-clock budget.
    # Reuses the same global-setup as `e2e-tests` (Docker Postgres, migrations,
    # seed, backend). Branch-protection / required-check config is handled
    # outside this workflow.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Safety net against runaway flake; smoke is expected to finish in ~1–2 min.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: bunx playwright install --with-deps chromium

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Run E2E smoke suite (@smoke)
        working-directory: ./frontend
        # `list` reporter gives concise CI output; `html` (written to disk,
        # never opened) gives a downloadable artifact on failure. 3 workers
        # matches CI default.
        run: bunx playwright test --grep @smoke --workers=3 --reporter=list,html
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: frontend/playwright-report/
          retention-days: 7

  e2e-tests:
    name: E2E Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # PSY-418: split the full E2E suite across 4 parallel shards. Each shard
    # spins its own Docker stack + backend (via global-setup.ts) on an
    # isolated runner, so there's no cross-shard port / DB contention.
    # Shard count chosen from the PSY-417 baseline (93s test phase,
    # 372s cumulative test-time) — 4 shards roughly quarters the test phase.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: bunx playwright install --with-deps chromium

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Run E2E tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        working-directory: ./frontend
        run: bunx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: frontend/blob-report/
          retention-days: 1

  e2e-report:
    name: E2E Merged Report
    # Run after all shards finish, even if some failed — we still want the
    # merged report artifact for triage.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        working-directory: ./frontend
        run: bunx playwright merge-reports --reporter html ../all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # PSY-411: post-merge CI failures on `main` used to silently go
  # unnoticed — the 000071 duplicate-migration collision lived on main
  # for 7 hours before anyone saw it. Branch protection gates PR-branch
  # CI, but the full E2E suite (sharded) only runs post-merge per
  # PSY-446's smoke/full split, so a merge-commit failure doesn't block
  # anything and doesn't page anyone.
  #
  # This job files a GitHub issue on any main-branch CI failure.
  # Dedupes against the commit SHA so rerun storms don't spam. No
  # external config — uses the built-in GITHUB_TOKEN.
  notify-main-failure:
    name: Notify on main CI failure
    # `always()` so this runs even when upstream `needs:` failed — the
    # whole point. Scoped to main-branch push events (not PRs).
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.migration-lint.result == 'failure' || needs.migration-reversibility.result == 'failure' || needs.backend-tests.result == 'failure' || needs.backend-lint.result == 'failure' || needs.mocks-gen-check.result == 'failure' || needs.api-types-check.result == 'failure' || needs.frontend-unit-tests.result == 'failure' || needs.frontend-lint.result == 'failure' || needs.e2e-tests.result == 'failure' || needs.e2e-report.result == 'failure') }}
    needs:
      - migration-lint
      - migration-reversibility
      - backend-tests
      - backend-lint
      - mocks-gen-check
      - api-types-check
      - frontend-unit-tests
      - frontend-lint
      - e2e-tests
      - e2e-report
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File or dedupe tracking issue
        uses: actions/github-script@v7
        env:
          RES_MIGRATION_LINT: ${{ needs.migration-lint.result }}
          RES_MIGRATION_REVERSIBILITY: ${{ needs.migration-reversibility.result }}
          RES_BACKEND_TESTS: ${{ needs.backend-tests.result }}
          RES_BACKEND_LINT: ${{ needs.backend-lint.result }}
          RES_MOCKS_GEN_CHECK: ${{ needs.mocks-gen-check.result }}
          RES_API_TYPES_CHECK: ${{ needs.api-types-check.result }}
          RES_FRONTEND_UNIT: ${{ needs.frontend-unit-tests.result }}
          RES_FRONTEND_LINT: ${{ needs.frontend-lint.result }}
          RES_E2E_TESTS: ${{ needs.e2e-tests.result }}
          RES_E2E_REPORT: ${{ needs.e2e-report.result }}
        with:
          script: |
            const shortSha = context.sha.substring(0, 7)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`

            // Dedupe: skip if an open `main-ci-failure` issue already
            // references this SHA. Catches retries of the same failing run.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'main-ci-failure',
              state: 'open',
              per_page: 50,
            })
            if (existing.some(i => i.title.includes(shortSha))) {
              core.info(`Open issue already references ${shortSha}; skipping.`)
              return
            }

            const results = {
              'Migration Lint': process.env.RES_MIGRATION_LINT,
              'Migration Reversibility': process.env.RES_MIGRATION_REVERSIBILITY,
              'Backend Tests': process.env.RES_BACKEND_TESTS,
              'Backend Lint': process.env.RES_BACKEND_LINT,
              'Mocks Generator Drift': process.env.RES_MOCKS_GEN_CHECK,
              'API Types Drift': process.env.RES_API_TYPES_CHECK,
              'Frontend Unit Tests': process.env.RES_FRONTEND_UNIT,
              'Frontend Lint': process.env.RES_FRONTEND_LINT,
              'E2E Tests (sharded)': process.env.RES_E2E_TESTS,
              'E2E Merged Report': process.env.RES_E2E_REPORT,
            }
            const failed = Object.entries(results)
              .filter(([_, r]) => r === 'failure')
              .map(([name]) => name)

            // Fetch commit metadata for author + subject. Nice-to-have —
            // file the issue even if this call fails.
            let authorLine = ''
            let commitSubject = shortSha
            try {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              })
              commitSubject = commit.commit.message.split('\n')[0]
              const login = commit.author && commit.author.login
              authorLine = login
                ? `Triggered by: @${login}`
                : `Commit author: ${commit.commit.author.name}`
            } catch (err) {
              core.warning(`Failed to fetch commit metadata: ${err.message}`)
            }

            const title = `Main CI failed: ${commitSubject.slice(0, 80)} (${shortSha})`
            const body = [
              `Post-merge CI on \`main\` failed.`,
              '',
              `**Failing jobs:** ${failed.join(', ') || '(none reported as "failure"; check the run directly)'}`,
              `**Run:** ${runUrl}`,
              `**Commit:** ${commitUrl}`,
              authorLine,
              '',
              '---',
              '',
              'Filed automatically by the `notify-main-failure` job (PSY-411). Close once the root cause is understood (revert, hotfix, or flake). A new issue will file automatically on the next failing run against a different commit.',
            ].filter(Boolean).join('\n')

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['main-ci-failure'],
            })
            core.info(`Filed issue #${created.number}: ${created.html_url}`)
