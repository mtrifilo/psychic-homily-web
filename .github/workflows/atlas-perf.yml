name: Atlas Perf

# Runs frontend/scripts/atlas-perf.mjs against the PR's Vercel preview: three
# cold runs, medians checked against the script's budget (DEFAULT_BUDGET in
# frontend/scripts/lib/atlas-perf-budget.mjs), with the report in the job
# summary.
#
# INFORMATIONAL: a missed budget never fails the job. The measurement step
# exits 0 whatever the verdict, writes the verdict and both tables to the job
# summary, and emits a `::warning::` annotation when the budget is missed.
# Only a broken measurement fails the job: a harness error (exit 2), no
# preview found, or a preview that never answers.
#
# What is gated: entry bytes to first map (and raster requests on a compact
# viewport). Entry bytes are the requests that finished by the moment the page
# reported its first rendered map; the bytes of the following 3 s are reported
# and never gated. The cut follows first map, so requests that finish near it
# can land on either side on a slower renderer; the bytes are far less
# machine-dependent than the time, and they are the only number a blocking
# version of this job gates on. First rendered map is printed against
# the owner's 3.5 s budget but not evaluated here: GitHub's runners have no
# GPU, Chromium renders through SwiftShader, and first map comes out at about
# 1.75x a local GPU run.
#
# Promotion: the blocking follow-up gates on entry bytes only, after this job
# has run on five PRs without a false alarm. The job stays PR-only, because a
# push to main deploys production, which this job must not measure.
#
# Preview discovery and the protection bypass work as in
# lighthouse-explore.yml: the deployments API finds the vercel[bot] Preview
# deployment for the PR head SHA, and the VERCEL_AUTOMATION_BYPASS_SECRET
# repository secret gets past Vercel SSO. Discovery accepts only a status that
# vercel[bot] posted with an https URL on this project's preview host pattern,
# so the secret goes nowhere else: to that host in the reachability probe,
# then to the script as VERCEL_PROTECTION_BYPASS, which sends it on one
# bypass-cookie request per run and redacts it from its output.

on:
  pull_request:
    branches: [main]
    paths:
      # The route and the feature module it mounts.
      - frontend/app/atlas/**
      - frontend/features/scenes/**
      # Files /atlas fetches during the entry: the globe GeoJSON and the
      # vendored MapLibre worker modules.
      - frontend/public/atlas/**
      - frontend/public/maplibre/**
      # Dependency versions (maplibre-gl among them) move the JS bytes.
      - frontend/package.json
      - frontend/bun.lock
      # The root layout, the chrome it renders and global CSS are part of
      # every entry; the chrome's links also decide what prefetches around
      # first map.
      - frontend/app/layout.tsx
      - frontend/components/layout/**
      - '!frontend/components/layout/**/*.test.tsx'
      - frontend/app/globals.css
      # Build and bundling configuration.
      - frontend/next.config.*
      # The measurement itself.
      - frontend/scripts/atlas-perf.mjs
      - frontend/scripts/lib/atlas-perf-budget.mjs
      - .github/workflows/atlas-perf.yml

# A newer push to the same PR supersedes a run still waiting or measuring.
concurrency:
  group: atlas-perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default for jobs without their own block; a job-scoped `permissions:` block
# REPLACES this rather than extending it.
permissions:
  contents: read

jobs:
  atlas-perf:
    name: Atlas perf (preview)
    runs-on: ubuntu-latest
    # Step caps: Playwright deps 10 + browsers 4 + preview wait 12 +
    # reachability 6 + measurement 20 = 52, plus about 4 for checkout, bun and
    # the install. 65 leaves slack so a step cap fires before the job cap.
    timeout-minutes: 65
    # `deployments: read` for the preview discovery; `contents: read` for
    # actions/checkout. The head SHA comes from `context.payload`, so no
    # `pull-requests` scope.
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Setup needs no preview, so it runs while Vercel is still building.
      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      # The same key as ci.yml's Playwright cache, which main's e2e job
      # writes; restore only.
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: v1-playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Harden apt against mirror stalls
        uses: ./.github/actions/harden-apt

      - name: Install Playwright system deps
        working-directory: ./frontend
        timeout-minutes: 10
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        timeout-minutes: 4
        run: ./node_modules/.bin/playwright install chromium

      # The script polls for up to 10 minutes; the cap adds room for the API
      # calls themselves.
      - name: Find Vercel preview URL
        id: vercel-preview
        timeout-minutes: 12
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const start = Date.now();
            const maxMs = 10 * 60 * 1000;
            const intervalMs = 5000;

            core.info(`Looking for Vercel Preview deployment for ${sha}`);

            while (Date.now() - start < maxMs) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                environment: 'Preview',
                per_page: 20,
              });

              for (const dep of deployments) {
                if (dep.creator?.login !== 'vercel[bot]') continue;
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: dep.id,
                  per_page: 20,
                });
                const success = statuses.find((s) => s.state === 'success' && s.creator?.login === 'vercel[bot]');
                if (!success?.target_url) continue;
                // The same host pattern as PREVIEW_HOST in atlas-perf.mjs.
                const url = new URL(success.target_url);
                if (url.protocol !== 'https:' || !/^psychic-homily-[a-z0-9-]+-matts-projects-722d5204\.vercel\.app$/.test(url.hostname)) {
                  core.setFailed(`Preview URL is not an https URL on this project's preview hosts: ${url.origin}`);
                  return;
                }
                core.info(`Found preview: ${url.origin}`);
                core.setOutput('url', url.origin);
                return;
              }

              await new Promise((r) => setTimeout(r, intervalMs));
            }

            core.setFailed('Timeout: no successful Vercel Preview deployment found for this PR head SHA');

      - name: Verify preview is reachable with bypass
        id: reach
        timeout-minutes: 6
        env:
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set. See lighthouse-explore.yml for setup."
            exit 1
          fi
          for i in $(seq 1 60); do
            STATUS=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
              -H "x-vercel-protection-bypass: $BYPASS" \
              "$PREVIEW_URL/atlas" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Preview /atlas is reachable with bypass."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview /atlas never returned 200 with the bypass header after 60 attempts."
          exit 1

      # A run waits at most 90 s each for navigation, first map and city view,
      # plus 6 s of settling, the bypass request (30 s) and the browser launch:
      # about 5 minutes worst case, so three runs fit in 20.
      - name: Measure /atlas on the preview
        id: measure
        working-directory: ./frontend
        timeout-minutes: 20
        env:
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.url }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set +e
          node scripts/atlas-perf.mjs "$PREVIEW_URL" --runs 3 --json atlas-perf.json \
            --first-map-informational "SwiftShader, informational, about 1.75x local GPU" | tee atlas-perf.md
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then
            detail=$(jq -r '.verdict | "entry bytes to first map \(.entryBytes / 1048576 * 100 | round / 100) MiB of \(.budget.entryBytes / 1048576 * 100 | round / 100) MiB, \(.rasterRequests) raster requests"' atlas-perf.json)
            echo "::warning title=Atlas perf budget missed::${detail}; see the job summary"
            exit 0
          fi
          exit "$code"

      # Only the script's stdout reaches the summary; its stderr (harness
      # errors) stays in the step log.
      - name: Write job summary
        if: ${{ !cancelled() }}
        working-directory: ./frontend
        env:
          DISCOVERY_OUTCOME: ${{ steps.vercel-preview.outcome }}
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.url }}
          REACH_OUTCOME: ${{ steps.reach.outcome }}
          EXIT_CODE: ${{ steps.measure.outputs.exit_code }}
        run: |
          if [ "$DISCOVERY_OUTCOME" = "skipped" ]; then
            result="not measured: setup failed before the preview lookup"
          elif [ -z "$PREVIEW_URL" ]; then
            result="not measured: no Vercel preview on this project's preview hosts was found for this commit"
          elif [ "$REACH_OUTCOME" != "success" ]; then
            result="not measured: the preview was unreachable or the bypass secret is missing"
          else
            case "$EXIT_CODE" in
              0) result="budget met: entry bytes to first map and raster requests (first map and the after-map bytes are informational)" ;;
              1) result="budget missed: entry bytes to first map or raster requests (first map and the after-map bytes are informational); see the warning annotation" ;;
              2) result="harness error (exit 2); see the step log" ;;
              *) result="the measurement did not finish (step timeout); see the step log" ;;
            esac
          fi
          {
            echo "## Atlas perf (preview, informational)"
            echo
            echo "Result: $result."
            echo
            if [ -s atlas-perf.md ]; then
              cat atlas-perf.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the JSON report
        if: ${{ !cancelled() && hashFiles('frontend/atlas-perf.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-perf
          path: frontend/atlas-perf.json
          retention-days: 14
